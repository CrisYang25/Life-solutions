mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: "NoProxy"
    type: direct

proxy-groups:
  - name: "策略选择"
    type: select
    proxies:
      - "DIRECT"
      - "NoProxy"

dns:
  enable: true
  ipv6: false
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: [https://dns.alidns.com/dns-query, https://doh.pub/dns-query]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['*.lan', '*.local', '+.stun.*.*', '+.stun.*.*.*']

tun:
  enable: true
  stack: system
  dns-hijack: [any:53]
  auto-route: true

